name: CI PII Scan (BSN/RSIN)

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'docs/**'
      - '.github/workflows/ci-pii-scan.yml'
      - '.github/scripts/Scan-ForPii.ps1'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  pii-scan:
    name: Scan for real BSN/RSIN
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PowerShell
        uses: PSModule/install-powershell@159c2929fac34e3c7fc55d75e8997fb27fc7f75a # v1.2.0
        with:
          Version: 7.5.0

      - name: Scan for real Dutch BSN/RSIN values
        shell: pwsh
        run: ./.github/scripts/Scan-ForPii.ps1
